name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  id-token: write
  contents: read

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Walidacja i Testy (Dev & Main)
  # ------------------------------------------------------------------
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17'

      # 2. SAST (Static Analysis)
      - name: Install Bandit
        run: pip install bandit

      - name: Run SAST (Bandit) on Backend
        # Skanuje kod w poszukiwaniu luk bezpieczeństwa, pomija venv
        run: |
          bandit -r backend/ -x backend/venv/ -f json -o bandit-report.json --exit-zero
          bandit -r backend/ -x backend/venv -lll

      # SAST Frontend - Kompleksowy skan (Zależności + Sekrety + Config)
      - name: Run Trivy Vulnerability Scanner (Frontend)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend/'
          hide-progress: false
          format: 'table'
          scanners: 'vuln,secret,config'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 3. Uruchomienie środowiska testowego (Docker Compose)
      - name: Create .env for testing
        run: |
          echo "DEBUG=True" >> .env
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> .env
          echo "DB_NAME=ycom_db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> .env
          # Kopiujemy do backendu, bo tam Dockerfile szuka env
          cp .env backend/.env

      - name: Build Containers (Local GitHub Environment)
        run: docker compose -p ci build

      - name: Debug cross-spawn and glob
        run: |
          docker run --rm ci-frontend:latest sh -c "find / -type d -name 'glob' 2>/dev/null" || true
          docker run --rm ci-frontend:latest sh -c "find / -type d -name 'cross-spawn' 2>/dev/null" || true


      # 4. Container Scanning (Trivy Image)
      # Skanujemy obrazy zbudowane przed chwilą
      - name: Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ci-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ci-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Start Containers (Local GitHub Environment)
        run: docker compose -p ci up -d

      - name: Wait for services to be ready
        run: sleep 30

      # 4. DAST (Dynamic Analysis) - Atakujemy localhost:3000

      - name: Run ZAP scan
        run: |
          mkdir -p $(pwd)/zap-wrk
          chmod 777 $(pwd)/zap-wrk
          
          docker run --rm \
            --name zap \
            --network host \
            -v $(pwd)/zap-wrk:/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r report.html \
            -w report.md \
            -J report.json \
            -a -j \
            -I"


        # 5. Upload raportów

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            bandit-report.json
            zap-wrk/
      
      - name: Create issue from scan
        if: always()
        run: |
          if [ -f zap-wrk/report.md ]; then
            echo "## OWASP ZAP Scan Results" > issue_body.md
            echo "" >> issue_body.md
            cat zap-wrk/report.md >> issue_body.md
            
            # Create issue via GitHub API
            gh issue create \
              --title "DAST Scan Results - $(date +'%Y-%m-%d')" \
              --body-file issue_body.md \
              --label "security,dast" \
              || echo "Could not create issue"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop Containers
        if: always()
        run: docker compose down

  # ------------------------------------------------------------------
  # JOB 2: Deploy na Produkcję (Tylko Main)
  # ------------------------------------------------------------------
  deploy-production:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Logowanie do AWS (OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 2. Terraform Apply (Zarządzanie infrastrukturą)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
          # Zapisz adres ALB do zmiennej, żeby przekazać go do Frontendu
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV

      # 3. Logowanie do ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build & Push Backend
      - name: Build and Push Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # UWAGA: Nazwa repozytorium musi zgadzać się z ecr.tf (ycom-backend-v2)
          ECR_REPO: ycom-backend-v2
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG ./backend
          # Oznaczamy też jako latest, żeby ECS łatwiej wstawał przy autoscalingu
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest

      # 5. Build & Push Frontend (z wstrzykniętym adresem API)
      - name: Build and Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ycom-frontend-v2
          IMAGE_TAG: ${{ github.sha }}
          # Używamy adresu ALB pobranego z Terraforma (dla HTTPS dodaj https://)
          API_URL: "https://${{ env.ALB_DNS }}/api" 
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=$API_URL -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest

      # 6. Aktualizacja ECS
      - name: Force ECS Deployment
        run: |
          aws ecs update-service --cluster ycom-cluster-v2 --service ycom-backend-svc-v2 --force-new-deployment
          aws ecs update-service --cluster ycom-cluster-v2 --service ycom-frontend-svc-v2 --force-new-deployment
