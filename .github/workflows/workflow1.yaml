name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  id-token: write
  contents: read

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Walidacja i Testy (Dev & Main)
  # ------------------------------------------------------------------
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17'

      # 2. SAST (Static Analysis)
      - name: Install Bandit
        run: pip install bandit

      - name: Run SAST (Bandit) on Backend
        # Skanuje kod w poszukiwaniu luk bezpieczeństwa, pomija venv
        run: bandit -r backend/ -x backend/venv/ -f json -o bandit-report.json || true
        # "|| true" sprawia, że pipeline nie wywali się od razu, 
        # można tu dodać logikę blokowania przy krytycznych błędach.

      # 3. Uruchomienie środowiska testowego (Docker Compose)
      - name: Create .env for testing
        run: |
          echo "DEBUG=True" >> .env
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> .env
          echo "DB_NAME=ycom_db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> .env
          # Kopiujemy do backendu, bo tam Dockerfile szuka env
          cp .env backend/.env

      - name: Start Containers (Local GitHub Environment)
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 30

      # 4. DAST (Dynamic Analysis) - Atakujemy localhost:3000

      - name: Fix permissions for ZAP
        run: chmod -R 777 .

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:3000'
          # Nie failuj builda na warningach, tylko na błędach
          fail_action: false 
          cmd_options: '-a'


        # 5. Upload raportów

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            bandit-report.json
            zap_report.json
            zap_resport.html
            zap_report.me


      - name: Stop Containers
        if: always()
        run: docker compose down

  # ------------------------------------------------------------------
  # JOB 2: Deploy na Produkcję (Tylko Main)
  # ------------------------------------------------------------------
  deploy-production:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Logowanie do AWS (OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 2. Terraform Apply (Zarządzanie infrastrukturą)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
          # Zapisz adres ALB do zmiennej, żeby przekazać go do Frontendu
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV

      # 3. Logowanie do ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build & Push Backend
      - name: Build and Push Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # UWAGA: Nazwa repozytorium musi zgadzać się z ecr.tf (bsiaw-social-backend-v2)
          ECR_REPO: bsiaw-social-backend-v2
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG ./backend
          # Oznaczamy też jako latest, żeby ECS łatwiej wstawał przy autoscalingu
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest

      # 5. Build & Push Frontend (z wstrzykniętym adresem API)
      - name: Build and Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: bsiaw-social-frontend-v2
          IMAGE_TAG: ${{ github.sha }}
          # Używamy adresu ALB pobranego z Terraforma (dla HTTPS dodaj https://)
          API_URL: "https://${{ env.ALB_DNS }}/api" 
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=$API_URL -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest

      # 6. Aktualizacja ECS
      - name: Force ECS Deployment
        run: |
          aws ecs update-service --cluster bsiaw-social-cluster-v2 --service bsiaw-social-backend-svc-v2 --force-new-deployment
          aws ecs update-service --cluster bsiaw-social-cluster-v2 --service bsiaw-social-frontend-svc-v2 --force-new-deployment
