<div>
	<p>hello {{request.user.username}}</p>
	<a href="/post/new/">new post</a>
</div>
<a href="/logout_page">logout</a>

<div>
	{% if posts %}
	<h2>latest posts</h2>
		{% for post in posts %}
		<h4>{{ post.author.username }}</h4>
		<h4>{{ post.date }}</h4>
		<p>{{ post.content }}</p>
		{% endfor %}
	{% else %}
		<p>no posts</p>
	{% endif %}
</div>
