version: '3.8'

services:
  # Baza danych PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ycom_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ycom_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    networks:
      - ycom_network
    healthcheck:
      test: ["CMD-SHELL", "pg-isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ycom_backend
    # ZMIANA: Poprawiona komenda startowa, aby używać `project_config.settings`
    # (Zakładając, że manage.py też jest poprawiony)
    command: >
      sh -c "python manage.py migrate --settings=project_config.settings &&
             python manage.py collectstatic --noinput --settings=project_config.settings &&
             python manage.py runserver 0.0.0.0:8000 --settings=project_config.settings"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      # ZMIANA: Dodajemy zmienną środowiskową na wszelki wypadek
      - DJANGO_SETTINGS_MODULE=project_config.settings
    networks:
      - ycom_network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ycom_frontend
    command: npm run dev
    volumes:
      # POPRAWKA: Upewnienie się, że ścieżki są poprawne
      - ./frontend/app:/app/app
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - ycom_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  ycom_network:
    driver: bridge